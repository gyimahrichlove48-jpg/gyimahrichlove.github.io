<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Richlove Gyimah's Portfolio</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden form for Netlify's build-time form detection.
      Netlify scans the built HTML for <form> tags with data-netlify="true" —
      it can't see the React form in Contact.jsx because that only exists after
      JavaScript runs in the browser. This static copy, with the exact same
      name and field names, is what lets Netlify register the "contact" form
      and give the real form a place to submit to. It's never shown to anyone.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
